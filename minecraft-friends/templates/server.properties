# Vanilla dedicated server tuned for a small friends game.
# The server may append extra keys on first boot; that is normal.
motd=Local Friends Server
server-port=25565
server-ip=
max-players=10
online-mode=true
white-list=false
enforce-whitelist=false
difficulty=normal
gamemode=survival
pvp=true
hardcore=false
force-gamemode=false
spawn-protection=16
view-distance=10
simulation-distance=8
max-tick-time=60000
player-idle-timeout=0
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
enable-command-block=false
enable-query=false
enable-rcon=false
enable-status=true
hide-online-players=false
# Required when friends join through playit.gg / any TCP tunnel.
prevent-proxy-connections=false
network-compression-threshold=256
sync-chunk-writes=true
use-native-transport=true
enforce-secure-profile=true
level-name=world
level-seed=
level-type=minecraft\:normal
function-permission-level=2
op-permission-level=4
broadcast-console-to-ops=true
rate-limit=0
accepts-transfers=false
log-ips=true
